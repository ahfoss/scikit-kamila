name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (Ubuntu with C++ coverage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install gcovr
          python -m pip install -e ".[test]" --config-settings=cmake.define.ENABLE_COVERAGE=ON

      - name: Install dependencies (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: python -m pip install -e ".[test]"


      - name: Run pytest with coverage
        run: |
          python -m pytest -v --cov=kamila --cov-report=xml --cov-report=term-missing --cov-fail-under=100 kamila

      - name: Generate C++ code coverage report (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          gcovr --root . --filter src/ --xml coverage-cpp.xml --print-summary

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Upload C++ coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage-cpp.xml
          flags: cpp
          fail_ci_if_error: false


  test-min-deps:
    # Install the exact floor versions of the runtime dependencies declared in
    # pyproject.toml, on the oldest supported Python, so a declared lower bound
    # that no longer works fails CI (see issue #31). Keep these pins in sync
    # with `dependencies` in pyproject.toml.
    name: ubuntu-latest - Python 3.9 - minimum dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # pandas 1.4.0 is the floor of the `test` extra and is compatible with
      # numpy 1.22.0 (pandas >= 2.1 needs numpy >= 1.22.4). pytest-cov is
      # installed because the pytest filterwarnings config references
      # coverage.exceptions. The Sphinx dependencies of the `test` extra are
      # skipped because test_doc.py is not run here. --only-binary makes a
      # missing wheel fail fast instead of building from source.
      - name: Install minimum dependencies
        run: |
          python -m pip install -e . \
            "numpy==1.22.0" \
            "scipy==1.8.0" \
            "scikit-learn==1.6.0" \
            "joblib==1.2.0" \
            "pandas==1.4.0" \
            pytest pytest-cov \
            --only-binary=numpy,scipy,scikit-learn,pandas
          python -m pip list

      # No --cov-fail-under: coverage is enforced by the main matrix, and some
      # version-specific lines are only reached on newer scikit-learn.
      - name: Run pytest
        run: |
          python -m pytest -v kamila --ignore=kamila/tests/test_doc.py
