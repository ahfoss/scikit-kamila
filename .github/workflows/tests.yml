name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} - Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies (Ubuntu with C++ coverage)
        if: matrix.os == 'ubuntu-latest'
        run: |
          python -m pip install gcovr
          python -m pip install -e ".[test]" --config-settings=cmake.define.ENABLE_COVERAGE=ON

      - name: Install dependencies (Windows/macOS)
        if: matrix.os != 'ubuntu-latest'
        run: python -m pip install -e ".[test]"


      - name: Run pytest with coverage
        run: |
          python -m pytest -v --cov=kamila --cov-report=xml --cov-report=term-missing --cov-fail-under=100 kamila

      - name: Generate C++ code coverage report (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          gcovr --root . --filter src/ --xml coverage-cpp.xml --print-summary

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage.xml
          flags: python
          fail_ci_if_error: false

      - name: Upload C++ coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage-cpp.xml
          flags: cpp
          fail_ci_if_error: false


